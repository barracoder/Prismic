name: Deploy Demo

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/demo-website/**'
      - 'packages/prismic-react/**'
  workflow_dispatch:

env:
  NODE_VERSION: 18

jobs:
  deploy:
    name: Deploy Demo Website
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build library
      run: npm run build -w packages/prismic-react
    
    - name: Build demo website
      run: npm run build -w packages/demo-website
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./packages/demo-website/dist
        cname: prismic-react-demo.example.com  # Update with your custom domain if needed

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build demo website
      run: |
        npm run build -w packages/prismic-react
        npm run build -w packages/demo-website
    
    - name: Serve website locally
      run: |
        cd packages/demo-website
        npx serve -s dist -l 3000 &
        sleep 5
    
    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli@0.14.x
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
