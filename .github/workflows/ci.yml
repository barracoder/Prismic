name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: 18

jobs:
  test:
    name: Test with Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20, 22]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'prismic-react/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd prismic-react
        npm ci
    
    - name: Run linting
      run: |
        cd prismic-react
        npm run lint
    
    - name: Run type checking
      run: |
        cd prismic-react
        npm run typecheck -w packages/prismic-react
    
    - name: Run unit tests
      run: |
        cd prismic-react
        npm run test
    
    - name: Run unit tests with coverage
      run: |
        cd prismic-react
        npm run test:coverage
      if: matrix.node-version == 18
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.node-version == 18
      with:
        file: ./prismic-react/packages/prismic-react/coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'prismic-react/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd prismic-react
        npm ci
    
    - name: Install Playwright browsers
      run: |
        cd prismic-react
        npx playwright install --with-deps
    
    - name: Build packages
      run: |
        cd prismic-react
        npm run build
    
    - name: Run E2E tests
      run: |
        cd prismic-react
        npm run test:e2e
    
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: prismic-react/playwright-report/
        retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'prismic-react/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd prismic-react
        npm ci
    
    - name: Build library
      run: |
        cd prismic-react
        npm run build -w packages/prismic-react
    
    - name: Build demo website
      run: |
        cd prismic-react
        npm run build -w packages/demo-website
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          prismic-react/packages/prismic-react/dist/
          prismic-react/packages/demo-website/dist/
        retention-days: 7

  package-health:
    name: Package Health Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'prismic-react/package-lock.json'
    
    - name: Install dependencies
      run: |
        cd prismic-react
        npm ci
    
    - name: Build library
      run: |
        cd prismic-react
        npm run build -w packages/prismic-react
    
    - name: Check package size
      run: |
        cd prismic-react/packages/prismic-react
        npm pack --dry-run
        ls -la dist/
    
    - name: Test package installation
      run: |
        cd prismic-react/packages/prismic-react
        npm pack
        cd ../demo-website
        npm install ../prismic-react/prismic-react-*.tgz
        npm run build
